<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d9488" />

    <title>Taurus — 企业级分布式运维平台</title>
    <meta
      name="description"
      content="Taurus 企业级分布式运维平台门户：Shell 脚本库、gRPC 主机执行器、Supervisor 守护进程、工作流编排、APScheduler 调度器、票据鉴权 7 大模块，面向中大型企业统一运维。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Taurus Portal" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      SEO baseline (static fallback):
      @vueuse/head injects per-route meta/title/client-side. For crawlers that
      only parse the initial HTML without executing JS, the lines below remain
      as a static fallback. Runtime @vueuse/head will override duplicates when
      the page hydrates. Replace {{SITE_URL}} with the absolute origin before
      deployment.
    -->
    <link rel="icon" type="image/svg+xml" href="{{SITE_URL}}/favicon.ico" />
    <link rel="canonical" href="{{SITE_URL}}/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Taurus",
        "alternateName": "Taurus Ops",
        "url": "https://taurus-ops.io",
        "logo": "{{SITE_URL}}/favicon.ico",
        "sameAs": ["https://github.com/taurus-ops/taurus-stack"]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
